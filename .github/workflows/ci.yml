name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - name: 检查包自己的测试
        run: npm test
      - name: 协议副本与检查包一致
        run: node scripts/sync-protocol.mjs --check
      - name: 模板：清单 + 握手 + 一轮
        run: |
          for dir in templates/*/; do node bin/check.mjs "$dir" --live; done
          node bin/check.mjs templates/agent --live --prompt "wait 演示自主轮次"
      - name: 插件：只查清单（CI 里没有各家的 CLI 与登录）
        run: for dir in plugins/*/; do node bin/check.mjs "$dir" --manifest; done
