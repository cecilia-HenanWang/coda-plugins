# Codex CLI 与 Claude Agent SDK 的新版本：每周为它们开一个 PR（docs 见 README「升级 Agent 的 CLI 与 SDK」）。
# 合并并发布后，Coda 里「设置 › 插件」点「检查更新」就用上；Coda 随后把它带的版本升上去。
version: 2
updates:
  - package-ecosystem: npm
    directory: /plugins/codex
    schedule:
      interval: weekly
    allow:
      - dependency-name: "@openai/codex"
    commit-message:
      prefix: "codex"
  - package-ecosystem: npm
    directory: /plugins/claude
    schedule:
      interval: weekly
    allow:
      - dependency-name: "@anthropic-ai/claude-agent-sdk"
    commit-message:
      prefix: "claude"
